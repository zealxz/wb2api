name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, asset: darwin-arm64 }
          - { goos: darwin, goarch: amd64, asset: darwin-amd64 }
          - { goos: linux,  goarch: amd64, asset: linux-amd64 }
          - { goos: linux,  goarch: arm64, asset: linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      # 1.25+ 才会在 darwin 目标上生成 LC_UUID；macOS 26 的 dyld 会拒绝缺失它的 Mach-O。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          ( cd gateway && go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/staging/bin/wb2api" ./cmd/server )
          ( cd panel && go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/staging/bin/wb2api-panel" ./cmd/server )

      # 预编译包只带运行必需的文件，不含 gateway/ panel/ 源码，因此下游也不需要 Go。
      - name: Stage runtime files
        run: |
          set -euo pipefail
          mkdir -p staging/config
          cp config/gateway.example.json config/panel.example.json \
             config/panel.native.example.json staging/config/
          cp -r scripts staging/
          cp setup-native.sh .env.example README.md LICENSE NOTICE.md staging/
          chmod +x staging/setup-native.sh staging/scripts/*.sh staging/scripts/*.py

      - name: Package
        run: tar -C staging -czf "wb2api-${{ matrix.asset }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-${{ matrix.asset }}
          path: wb2api-${{ matrix.asset }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "非 tag 触发，仅验证构建，不发布。"
            exit 0
          fi
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "wb2api ${GITHUB_REF_NAME}" \
            --generate-notes \
            *.tar.gz SHA256SUMS
